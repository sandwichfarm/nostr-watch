services:
  relaymon:
    image: nostrwatch/relaymon:clearnet
    container_name: relaymon
    restart: unless-stopped
    volumes:
      - ../data:/opt/data
      - ../.docker.env:/app/.env
      - ../.docker.env:/app/nostr-watch/apps/relaymon/.env
      - ../config.docker.yaml:/opt/config.yaml
      - ../data/relays.db:/opt/relays.db
    environment:
      - RELAYMON_CONFIG_PATH=/opt/config.yaml
      - RELAYMON_DB_PATH=/opt/relays.db
      - RELAYMON_SKIP_PID_CHECK=true
    extra_hosts:
      - "host.docker.internal:host-gateway"

  trawler:
    image: nostrwatch/trawler:clearnet
    container_name: trawler
    restart: unless-stopped
    volumes:
      - ../../trawler/.docker.env:/app/.env
      - ../../trawler/.docker.env:/app/nostr-watch/apps/trawler/.env
      - ../../trawler/config.docker.yaml:/app/nostr-watch/apps/trawler/config.yaml
      - ../data/relays.db:/opt/relays.db
    environment:
      - TRAWLER_CONFIG_PATH=/app/nostr-watch/apps/trawler/config.yaml
      - TRAWLER_DB_PATH=/opt/relays.db
    extra_hosts:
      - "host.docker.internal:host-gateway"
