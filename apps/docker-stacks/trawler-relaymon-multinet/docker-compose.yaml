services:
  relaymon:
    image: nostrwatch/relaymon:latest
    container_name: relaymon
    restart: unless-stopped
    volumes:
      - ./data:/opt/data
      - ./relaymon.env:/app/.env
      - ./relaymon.env:/app/nostr-watch/apps/relaymon/.env
      - ./relaymon-config.yaml:/opt/config.yaml
      - ./config/danted.conf:/etc/danted.conf
      - ./config/proxychains.conf:/etc/proxychains.conf
    networks:
      - relaymon-net
    depends_on:
      tor-proxy:
        condition: service_healthy
      i2pd:
        condition: service_healthy
    cap_add:
      - NET_ADMIN
      - NET_RAW
    environment:
      - RELAYMON_MODE=multinet
      - RELAYMON_CONFIG_PATH=/opt/config.yaml
      - RELAYMON_DB_PATH=/opt/data/relays.db
      - RELAYMON_SKIP_PID_CHECK=true
    extra_hosts:
      - "host.docker.internal:host-gateway"

  trawler:
    image: nostrwatch/trawler:latest
    container_name: trawler
    restart: unless-stopped
    volumes:
      - ./data:/opt/data
      - ./trawler-config.yaml:/opt/trawler-config.yaml
    networks:
      - relaymon-net
    environment:
      - TRAWLER_CONFIG_PATH=/opt/trawler-config.yaml
      - TRAWLER_DB_PATH=/opt/data/relays.db
    extra_hosts:
      - "host.docker.internal:host-gateway"

  tor-proxy:
    image: chriswayg/tor-alpine:latest
    container_name: tor-proxy
    restart: unless-stopped
    volumes:
      - ./config/torrc:/etc/tor/torrc
    networks:
      - relaymon-net
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 9050 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  i2pd:
    image: purplei2p/i2pd:latest
    container_name: i2pd
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c", "rm -rf \"$$DATA_DIR\"/certificates && ln -s /i2pd_certificates \"$$DATA_DIR\"/certificates && exec /usr/local/bin/i2pd $$DEFAULT_ARGS $$@", "--"]
    volumes:
      - i2pd-data:/home/i2pd/data
    networks:
      - relaymon-net
    healthcheck:
      test: ["CMD-SHELL", "echo Q | nc -w1 127.0.0.1 4444 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  relaymon-net:
    driver: bridge

volumes:
  i2pd-data:
    driver: local
