<!doctype html>
<html class="dark" lang="en">
	<head>
		<meta charset="utf-8" />
		<!-- Favicon links -->
		<link rel="apple-touch-icon" sizes="180x180" href="%sveltekit.assets%/apple-touch-icon.png">
		<link rel="icon" type="image/png" sizes="32x32" href="%sveltekit.assets%/favicon-32x32.png">
		<link rel="icon" type="image/png" sizes="16x16" href="%sveltekit.assets%/favicon-16x16.png">
		<link rel="manifest" href="%sveltekit.assets%/site.webmanifest">
		<link rel="icon" href="%sveltekit.assets%/favicon.ico"> <!-- Fallback ICO -->
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap"
			rel="stylesheet"
		/>
		<script>
			// Function to check if we're in production
			const isProduction = () => {
				// Check if import.meta.env.MODE is available
				if (typeof window !== 'undefined' && window.__SVELTEKIT_DEV__) {
					return false;
				}
				return true;
			};

			const toggleDarkMode = (isDark) => {
				if (isDark) {
					document.documentElement.classList.add('dark');
				} else {
					document.documentElement.classList.remove('dark');
				}
			}

			// In production, always force dark mode
			// In development, respect system preference
			if (isProduction()) {
				toggleDarkMode(true); // Force dark mode in production
			} else {
				const checkColorScheme = () => {
					return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
				};
				
				toggleDarkMode(checkColorScheme());
				
				// Only listen for color scheme changes in development
				window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', (e) => {
					toggleDarkMode(e.matches);
				});
			}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover" class="overflow-y-auto">
		<div>%sveltekit.body%</div>
	</body>
</html>
