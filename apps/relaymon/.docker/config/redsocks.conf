base {
    // Log debugging info? (1=yes, 0=no)
    log_debug = 1;

    // Log info? (1=yes, 0=no)
    log_info = 1;

    // Where to log? ("syslog:<facility>" or "stderr" or "file:<file_path>")
    log = "stderr";

    // Redirect TCP connections? (on|off)
    daemon = off;

    // Where to write pidfile? (/path/to/pidfile)
    // pidfile = "/var/run/redsocks.pid";

    // User and group to run as
    user = redsocks;
    group = redsocks;

    // Local IP and Port to listen on for redirects
    local_ip = 127.0.0.1;
    local_port = 12345; // This is where iptables redirects to

    // Network interface to use for outgoing connections (optional)
    // interface = eth0;

    // Number of worker threads (optional)
    // workers = 4;
}

// Default: TOR
redsocks {
    // Proxy type: socks4, socks5, http-connect, http-relay
    type = socks5;

    // Tor Proxy IP/hostname and port
    ip = tor-proxy;
    port = 9050;

    // Timeout in milliseconds (optional)
    // timeout = 10000;

    // User and password for socks5 auth (optional)
    // login = "user";
    // password = "pass";
}

// I2P: Using HTTP Connect
redsocks {
    // Proxy type: Use http-connect for I2P HTTP Proxy
    type = http-connect;

    // I2P Proxy IP/hostname and port
    ip = i2pd;
    port = 4444;
}

// LOKINET: Using SOCKS5
redsocks {
    // Proxy type: Assuming SOCKS5 for lokinet
    type = socks5;

    // Lokinet Proxy IP/hostname and port (Ensure this matches compose/lokinet service)
    ip = lokinet;
    port = 9060;
} 