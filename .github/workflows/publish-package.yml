      #   run: |
      #     VERSION=${{ env.VERSION }}
      #     echo "Deploying version $VERSION"
      #     ssh -v -i ~/.ssh/gui_ssh_key -o StrictHostKeyChecking=no ${{ secrets.GUI_HOST_USER }}@${{ secrets.GUI_HOST_IP }} << EOF
