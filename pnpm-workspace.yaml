packages:
  - "apps/*"
  - "demos/*"
  - "internal/*"
  - "internal/publisher/adapters/**/*"
  - "libraries/*"
  - "libraries/nocap/adapters/**/*"
  - "libraries/kit/adapters/**/*"
  - "libraries/route66/adapters/cache/**/*"
  - "libraries/route66/adapters/websocket/**/*"
  - "libraries/adapters/**/*"
  - "libraries/validators/**/*"
  - "libraries/schemata/*"

  #skip
  - '!internal/controlflow'
  - '!apps/nocapd' #node
  - '!libraries/nocap-route66' #deprecated
  - '!apps/umon' #experimental
  - '!apps/relaymon' #deno
# Dependency version overrides. pnpm 10+ no longer reads `pnpm.overrides` from
# package.json — these security pins must live here to take effect.
overrides:
  pbkdf2: '>=3.1.3'
  sha.js: '>=2.4.12'
  form-data: '>=2.5.4'
  ejs: '>=3.1.10'
  find-my-way: '>=8.2.2'
  ip: '>=1.1.9'
  tar-fs: '>=2.1.4'
  '@isaacs/brace-expansion': '>=5.0.1'
  bn.js: '>=5.2.3'
  nanoid: '>=5.0.9'
  tough-cookie: '>=4.1.3'
  lodash-es: '>=4.17.23'
  devalue: '>=5.6.3'
  qs: '>=6.14.2'
  diff: '>=4.0.4'
  cookie: '>=0.7.0'
  '@eslint/plugin-kit': '>=0.3.4'
  on-headers: '>=1.1.0'
  tmp: '>=0.2.4'

# Dependencies allowed to run install/build scripts. pnpm 10+ blocks these by default;
# pnpm 11 records the decision per-package here as true/false. These are all legitimate
# native/build deps of this monorepo, so allow them to build.
allowBuilds:
  '@swc/core': true
  better-sqlite3: true
  bufferutil: true
  core-js: true
  es5-ext: true
  esbuild: true
  lmdb: true
  maplibre-gl: true
  msgpackr-extract: true
  secp256k1: true
  svelte-preprocess: true
  utf-8-validate: true
