db: 
  path: .data/db.sqlite

monitor:
  slug: trawler.eighteen
  info:
    name: "trawler"
    about: "Trawls nostr for relays, dedupes, validates, checks liveness, and publishes events."
    nip05: trawler@nostr.watch
  geo:
    city: "Frankfurt am Main"
    country: "Germany"
    countryCode: "DE"
    lat: 50.1169
    lon: 8.6821
    region: "Hesse"
    continent: "Europe"

publisher:
  relays:
    - "wss://relay.nostr.watch"
    - "wss://relaypag.es"

relaymon:
  networks:
    - clearnet
    - tor
    - i2p
  retry:
    expiry:
      - { max: 3, delay: "1m" }
      - { max: 5, delay: "20m" }
      - { max: 7, delay: "1h" }
      - { max: 11, delay: "3h" }
      - { max: 15, delay: "6h" }
      - { max: 22, delay: "24h" }
      - { max: 107, delay: "7d" }
  seed:
    interval: "30m"
    sources:
      - events 
    options:
      db:
        path: "./relay.db"
      static:
        path: "./seed.yaml"
      config: []
      events:
        pubkeys: 
          - "9e81fadfe8c07351d806b47bc6c0d0dfb189343656e400e207a2be9b37411e79"
        relays:
          - "wss://relay.nostr.watch"
          - "wss://relaypag.es"
  checks:
    enabled:
      - open
      - read 
      - dns 
      - info 
    options:
      expires: "1h"
      interval: "30s"
      timeout:
        open: 30000
        read: 5000
      max: "200"

queue:
  workerConcurrency: 10

health:
  enabled: true

  # HTTP health server configuration
  server:
    enabled: true
    host: "127.0.0.1"  # Bind to localhost (use 0.0.0.0 for all interfaces)
    port: 1987         # Health server port
    authEnabled: false # Enable token authentication (requires RELAYMON_HEALTH_AUTH_TOKEN env var)

  # Uptime Kuma push configuration
  kuma:
    enabled: true
    intervalMs: 60000        # Push interval (60 seconds)
    degradedAsUp: false       # Report "degraded" state as "up" to Kuma (with message)
    startupGraceMs: 30000    # Wait 30s after startup before first push
    msgVerbosity: "detailed"  # Message verbosity: "summary" or "detailed"

  # Health check thresholds
  thresholds:
    checkIdleMs: 300000         # Check loop idle threshold (5 minutes)
    publishBacklogMax: 200      # Max pending publish events before degraded
    errorRatePerMin: 5         # Max errors per minute before degraded
    startupGraceMs: 30000       # Startup grace period (30 seconds)
