version: '3.8'

services:
  # Default clearnet service
  relaymon-clearnet:
    build:
      context: ..
      dockerfile: .docker/Dockerfile.clearnet
    container_name: relaymon-clearnet
    restart: unless-stopped
    volumes:
      - ../data:/app/data
      - ../config.yaml:/app/config.yaml
      - ../blocklists:/app/blocklists
    command: deno run --allow-ffi --unstable-sloppy-imports --allow-net --allow-env --allow-read --allow-write --allow-run index.ts
    networks:
      - relaymon-net

  # Tor-enabled service
  relaymon-tor:
    build:
      context: ..
      dockerfile: .docker/Dockerfile.tor
    container_name: relaymon-tor
    restart: unless-stopped
    volumes:
      - ../data:/app/data
      - ../config.yaml.tor:/app/config.yaml
      - ../blocklists:/app/blocklists
    command: torsocks deno run --allow-ffi --unstable-sloppy-imports --allow-net --allow-env --allow-read --allow-write --allow-run index.ts
    networks:
      - relaymon-net

  # I2P-enabled service
  relaymon-i2p:
    build:
      context: ..
      dockerfile: .docker/Dockerfile.i2p
    container_name: relaymon-i2p
    restart: unless-stopped
    volumes:
      - ../data:/app/data
      - ../config.yaml.i2p:/app/config.yaml
      - ../blocklists:/app/blocklists
    depends_on:
      - i2pd
    command: deno run --allow-ffi --unstable-sloppy-imports --allow-net --allow-env --allow-read --allow-write --allow-run index.ts
    networks:
      - relaymon-net

  # Lokinet-enabled service
  relaymon-lokinet:
    build:
      context: ..
      dockerfile: .docker/Dockerfile.lokinet
    container_name: relaymon-lokinet
    restart: unless-stopped
    volumes:
      - ../data:/app/data
      - ../config.yaml.lokinet:/app/config.yaml
      - ../blocklists:/app/blocklists
    command: deno run --allow-ffi --unstable-sloppy-imports --allow-net --allow-env --allow-read --allow-write --allow-run index.ts
    networks:
      - relaymon-net
    # Note: Lokinet typically requires host networking to work properly when running in a local development environment
    # Uncomment this in a development setup if needed:
    # network_mode: "host"

  # I2P router service
  i2pd:
    image: purplei2p/i2pd:latest
    container_name: i2pd
    restart: unless-stopped
    volumes:
      - i2pd-data:/home/i2pd/data
    ports:
      - "7070:7070" # HTTP proxy
      - "4444:4444" # HTTP proxy
      - "4447:4447" # SAM bridge
    networks:
      - relaymon-net

networks:
  relaymon-net:
    driver: bridge

volumes:
  i2pd-data:
    driver: local 