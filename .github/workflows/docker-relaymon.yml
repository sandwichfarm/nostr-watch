name: Publish relaymon Docker images

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag override (defaults to version from deno.json)'
        required: false
        type: string
  push:
    tags:
      - 'relaymon-v*'

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract version
        id: version
        shell: bash
        run: |
          if [[ -n "${{ inputs.tag }}" ]]; then
            VERSION="${{ inputs.tag }}"
          elif [[ "${{ github.ref_type }}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#relaymon-v}"
          else
            VERSION="$(grep -oP '"version"\s*:\s*"\K[^"]+' apps/relaymon/deno.json)"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & push multinet image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/relaymon/.docker/Dockerfile.multinet
          push: true
          platforms: linux/amd64
          tags: |
            nostrwatch/relaymon:latest
            nostrwatch/relaymon:multinet
            nostrwatch/relaymon:${{ steps.version.outputs.version }}
            nostrwatch/relaymon:${{ steps.version.outputs.version }}-multinet

      - name: Build & push clearnet image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/relaymon/.docker/Dockerfile.clearnet
          push: true
          platforms: linux/amd64
          tags: |
            nostrwatch/relaymon:clearnet
            nostrwatch/relaymon:${{ steps.version.outputs.version }}-clearnet
