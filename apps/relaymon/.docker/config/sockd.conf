logoutput: stderr
internal: 0.0.0.0 port = 12346
external: eth0

socksmethod: none
clientmethod: none

client pass {
    from: 0.0.0.0/0 to: 0.0.0.0/0
    log: error
}

socks pass {
    from: 0.0.0.0/0 to: 0.0.0.0/0
    command: bind connect udpassociate
    log: error
}

route {
    from: 0.0.0.0/0 to: 0.0.0.0/0 via: 127.0.0.1 port = 12345
    proxyprotocol: socks_v5
    log: error
} 