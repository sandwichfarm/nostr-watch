name: Release

on:
  push:
    branches: [next]
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.15.0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm -r --filter '!@nostrwatch/gui' build

      - name: Create Release Pull Request or Publish
        id: changesets
        uses: changesets/action@v1
        with:
          version: pnpm changeset version
          publish: pnpm changeset publish
          title: "chore: version packages"
          commit: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Releases
        if: steps.changesets.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          echo '${{ steps.changesets.outputs.publishedPackages }}' | \
            node -e "
              const pkgs = JSON.parse(require('fs').readFileSync(0,'utf8'));
              for (const p of pkgs) {
                const tag = p.name.replace('@nostrwatch/','') + '@v' + p.version;
                console.log(tag);
              }
            " | while read -r TAG; do
              echo "Creating release: $TAG"
              gh release create "$TAG" --title "$TAG" --generate-notes --latest=false || echo "Release $TAG already exists"
            done

  deploy-gui:
    name: Deploy GUI
    needs: release
    if: always()
    permissions:
      contents: read
    uses: ./.github/workflows/gui-deploy.yml
    secrets: inherit
