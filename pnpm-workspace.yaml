packages:
  - "apps/*"
  - "demos/*"
  - "internal/*"
  - "internal/publisher/adapters/**/*"
  - "libraries/*"
  - "libraries/nocap/adapters/**/*"
  - "libraries/kit/adapters/**/*"
  - "libraries/route66/adapters/cache/**/*"
  - "libraries/route66/adapters/websocket/**/*"
  - "libraries/adapters/**/*"
  - "libraries/validators/**/*"
  - "libraries/schemata/*"

  #skip
  - '!internal/controlflow'
  - '!apps/nocapd' #node
  - '!libraries/nocap-route66' #deprecated
  - '!apps/umon' #experimental
  - '!apps/relaymon' #deno
overrides:
  crypto-browserify: 3.12.0
  pbkdf2: '>=3.1.3'
  sha.js: '>=2.4.12'
  form-data: '>=2.5.4'
  ejs: '>=3.1.10'
  find-my-way: '>=8.2.2'
  ip: '>=1.1.9'
  tar-fs: '>=2.1.4'
  '@isaacs/brace-expansion': '>=5.0.1'
  bn.js: '>=5.2.3'
  nanoid: '>=5.0.9'
  tough-cookie: '>=4.1.3'
  lodash: '>=4.17.24'
  lodash-es: '>=4.17.24'
  devalue: '>=5.8.1'
  qs: '>=6.15.2'
  diff: '>=4.0.4'
  cookie: '>=0.7.0'
  '@eslint/plugin-kit': '>=0.3.4'
  on-headers: '>=1.1.0'
  tmp: '>=0.2.6'
  fast-uri: '>=3.1.2'
  follow-redirects: '>=1.15.12'
  immutable: '>=5.1.5'
  js-yaml: '>=4.1.2'
  '@babel/core': '>=7.29.1'
  protocol-buffers-schema: '>=3.6.1'
  yaml: '>=2.8.3'
  glob@10: 10.5.0
  minimatch@9: 9.0.7
  picomatch: 2.3.2
  brace-expansion@1: 1.1.16
  brace-expansion@2: 2.1.2
  brace-expansion@5: 5.0.7
allowBuilds:
  '@parcel/watcher': true
  '@swc/core': true
  better-sqlite3: true
  bufferutil: true
  core-js: false
  ejs: false
  es5-ext: false
  esbuild: true
  lmdb: true
  maplibre-gl: false
  msgpackr-extract: true
  secp256k1: true
  svelte-preprocess: false
  utf-8-validate: true
